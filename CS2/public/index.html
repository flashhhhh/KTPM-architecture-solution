<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image and Download PDF</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <h1>Upload Image and Download Translated PDF</h1>
    <form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
        <!-- <label for="file">Choose a file (Image or Zip):</label> -->
        <input type="file" name="file" id="file" accept=".zip, .jpg, .jpeg, .png" required>
        <button type="submit">Upload and Process</button>
    </form>

    <div id="result" style="display:none;">
        <!-- <p>Download</p> -->
        <a id="downloadLink" href="#" download>Download Processed File</a>
    </div>
    <script>
        document.getElementById("uploadForm").onsubmit = async function (event) {
            event.preventDefault();

            const formData = new FormData(this);

            try {
                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData,
                });

                const data = await response.json();

                document.getElementById("downloadLink").href = data.downloadLink;
                document.getElementById("result").style.display = "block";
            } catch (err) {
                console.error("Error uploading file:", err);
            }
        };

    </script>
</body>
</html>
