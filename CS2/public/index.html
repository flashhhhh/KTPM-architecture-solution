<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image and Download PDF</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <h1>Upload Image and Download Translated PDF</h1>
    <form id="uploadForm" action="/upload" method="POST" enctype="multipart/form-data">
        <label for="zipfile">Choose a zip file:</label>
        <input type="file" name="zipfile" id="zipfile" accept=".zip" required>
        <button type="submit">Upload and Process</button>
    </form>

    <div id="result" style="display:none;">
        <p>Download your PDF:</p>
        <a id="downloadLink" href="#" download="processed_files.zip">Download Processed Files</a>
    </div>
    <script>
        document.getElementById("uploadForm").onsubmit = async function (event) {
            event.preventDefault();

            const formData = new FormData(this);

            try {
                // Gửi yêu cầu upload tới server
                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData,
                });

                // Chờ server trả về đường dẫn download PDF
                const data = await response.json();

                // Cập nhật giao diện để hiển thị link download
                document.getElementById("downloadLink").href = data.downloadLink;
                document.getElementById("result").style.display = "block";
            } catch (err) {
                console.error("Error uploading file:", err);
            }
        };

    </script>
</body>
</html>
